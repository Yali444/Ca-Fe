name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        # Fails on errors only; existing warnings are allowed to pass through.
        run: npm run lint

      - name: Type-check (includes test files)
        # `next build` skips test files, so type errors inside *.test.ts
        # can slip past CI. Run tsc explicitly to catch them.
        run: npx tsc --noEmit

      - name: Validate dataset
        # The test suite covers code; this covers the data it reads — malformed
        # opening hours, bad phone numbers, duplicate Google place ids and the
        # like have reached production before, and none of them are type errors.
        run: npm run validate:data

      - name: Test
        # Runs the same suite as `npm test`, plus the coverage thresholds in
        # vitest.config.ts — so a change that drops coverage fails here rather
        # than being noticed months later.
        run: npm run coverage

      - name: Build
        run: npm run build
        env:
          # Stub values for build-time SSR; the real values come from Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key-for-ci-build-only
