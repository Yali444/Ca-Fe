<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OpenGraph Image Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .container {
            width: 1200px;
            height: 630px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 25%, #1e40af 50%, #2563eb 75%, #3b82f6 100%);
            position: relative;
            overflow: hidden;
        }
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            max-width: 1000px;
            margin: 0 40px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .logo {
            width: 120px;
            height: 120px;
            background: #ffffff;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .logo img {
            width: 112px;
            height: 112px;
            border-radius: 56px;
        }
        .title {
            font-size: 64px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .subtitle {
            font-size: 28px;
            color: #e0f2fe;
            margin-bottom: 0;
            max-width: 800px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="logo">
                <img src="file:///C:/Users/Yali/OneDrive/Documents/Cursor Projects/Ca fe/public/images/ca_fe_logo.png" alt="Ca Fe Logo" />
            </div>
            <div class="title">
                Israel Specialty<br>
                Coffee Guide
            </div>
            <div class="subtitle">
                Discover the best specialty coffee shops across Israel
            </div>
        </div>
    </div>
</body>
</html>
