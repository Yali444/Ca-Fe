<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Cafe Coordinates</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 20px;
      height: calc(100vh - 40px);
    }
    .sidebar {
      background: white;
      border-radius: 8px;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .cafe-item {
      padding: 12px;
      margin-bottom: 8px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cafe-item:hover {
      border-color: #3b82f6;
      background: #f0f9ff;
    }
    .cafe-item.active {
      border-color: #3b82f6;
      background: #dbeafe;
    }
    .cafe-name {
      font-weight: bold;
      margin-bottom: 4px;
    }
    .cafe-address {
      font-size: 0.9em;
      color: #666;
      margin-bottom: 4px;
    }
    .cafe-coords {
      font-size: 0.85em;
      color: #888;
      font-family: monospace;
    }
    .search-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 16px;
    }
    .map-container {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .info-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 300px;
      z-index: 1000;
    }
    .info-panel h3 {
      margin-bottom: 10px;
    }
    .info-panel button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .info-panel button:hover {
      background: #2563eb;
    }
    .coords-input {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: monospace;
    }
    .copy-btn {
      background: #10b981;
      margin-top: 5px;
    }
    .copy-btn:hover {
      background: #059669;
    }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <input type="text" class="search-box" id="search" placeholder="חיפוש קפה...">
      <div id="cafe-list"></div>
    </div>
    <div class="map-container">
      <div id="map"></div>
      <div class="info-panel" id="info-panel" style="display: none;">
        <h3 id="cafe-name"></h3>
        <p id="cafe-address"></p>
        <div style="margin-top: 10px;">
          <label>Latitude:</label>
          <input type="text" class="coords-input" id="lat-input" readonly>
          <label>Longitude:</label>
          <input type="text" class="coords-input" id="lng-input" readonly>
          <button class="copy-btn" onclick="copyCoords()">📋 העתק קואורדינטות</button>
          <button onclick="centerOnMarker()">📍 מרכז על הסימון</button>
          <button onclick="openInGoogleMaps()">🗺️ פתח ב-Google Maps</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Paste your cafes data here from roasteries.ts
    const cafes = [
      // Example:
      // { id: 1, name: "קפה 51", city: "גבעתיים", address: "אריאל שרון 10", lat: 32.080681, lng: 34.799844 },
      // ... add all cafes here
    ];

    let map;
    let markers = [];
    let currentMarker = null;
    let currentCafe = null;

    // Initialize map centered on Tel Aviv
    function initMap() {
      map = L.map('map').setView([32.0809, 34.7806], 13);
      
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      // Add click handler to map
      map.on('click', function(e) {
        if (currentCafe) {
          updateMarker(e.latlng.lat, e.latlng.lng);
        }
      });

      // Load cafes
      loadCafes();
    }

    function loadCafes() {
      const list = document.getElementById('cafe-list');
      const searchInput = document.getElementById('search');

      function renderCafes(filter = '') {
        list.innerHTML = '';
        const filtered = cafes.filter(c => 
          c.name.includes(filter) || 
          c.address.includes(filter) ||
          c.city.includes(filter)
        );

        filtered.forEach(cafe => {
          const div = document.createElement('div');
          div.className = 'cafe-item';
          div.innerHTML = `
            <div class="cafe-name">${cafe.name}</div>
            <div class="cafe-address">${cafe.address}, ${cafe.city}</div>
            <div class="cafe-coords">${cafe.lat.toFixed(6)}, ${cafe.lng.toFixed(6)}</div>
          `;
          div.onclick = () => selectCafe(cafe);
          list.appendChild(div);
        });

        // Add markers to map
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        filtered.forEach(cafe => {
          const marker = L.marker([cafe.lat, cafe.lng])
            .addTo(map)
            .bindPopup(cafe.name);
          marker.on('click', () => selectCafe(cafe));
          markers.push(marker);
        });
      }

      searchInput.oninput = (e) => renderCafes(e.target.value);
      renderCafes();
    }

    function selectCafe(cafe) {
      currentCafe = cafe;
      currentMarker = markers.find(m => 
        m.getLatLng().lat === cafe.lat && 
        m.getLatLng().lng === cafe.lng
      );

      // Update UI
      document.querySelectorAll('.cafe-item').forEach(el => {
        el.classList.remove('active');
      });
      event.target.closest('.cafe-item')?.classList.add('active');

      // Center map
      map.setView([cafe.lat, cafe.lng], 17);

      // Show info panel
      document.getElementById('info-panel').style.display = 'block';
      document.getElementById('cafe-name').textContent = cafe.name;
      document.getElementById('cafe-address').textContent = `${cafe.address}, ${cafe.city}`;
      document.getElementById('lat-input').value = cafe.lat.toFixed(6);
      document.getElementById('lng-input').value = cafe.lng.toFixed(6);
    }

    function updateMarker(lat, lng) {
      if (!currentMarker || !currentCafe) return;

      currentMarker.setLatLng([lat, lng]);
      currentCafe.lat = lat;
      currentCafe.lng = lng;
      document.getElementById('lat-input').value = lat.toFixed(6);
      document.getElementById('lng-input').value = lng.toFixed(6);
    }

    function copyCoords() {
      const lat = document.getElementById('lat-input').value;
      const lng = document.getElementById('lng-input').value;
      navigator.clipboard.writeText(`{ lat: ${lat}, lng: ${lng} }`);
      alert('קואורדינטות הועתקו!');
    }

    function centerOnMarker() {
      if (currentMarker) {
        map.setView(currentMarker.getLatLng(), 18);
      }
    }

    function openInGoogleMaps() {
      if (currentCafe) {
        const url = `https://www.google.com/maps/search/?api=1&query=${currentCafe.lat},${currentCafe.lng}`;
        window.open(url, '_blank');
      }
    }

    // Initialize on load
    window.onload = initMap;
  </script>
</body>
</html>
